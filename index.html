<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>森林守卫：甜橙谷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="evolution.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">🍊</div><div><h1>甜橙谷</h1><span>森林守卫 · 第 03 章</span></div></div>
      <div class="stats">
        <div class="stat"><span class="stat-icon">💛</span><b id="lives">12</b><small>生命</small></div>
        <div class="stat"><span class="stat-icon">💰</span><b id="coins">180</b><small>金币</small></div>
        <div class="stat"><span class="stat-icon">🌟</span><b id="score">0</b><small>得分</small></div>
      </div>
      <button class="sound-btn" id="soundBtn" title="切换音效">🔊</button>
    </header>
    <section class="stage-wrap">
      <div class="stage-head"><div><strong>无尽林地</strong><span id="message">不断合成守卫，完成最终进化即可解锁决胜波。</span></div><div class="wave-box"><span>WAVE</span><b id="wave">1</b><em>/ ∞</em></div></div>
      <div class="canvas-frame"><canvas id="game" width="960" height="540"></canvas><div class="hint" id="hint">拖动到绿色格子 · 道路格禁止放置 · 同级重叠可合成</div></div>
      <div class="stage-foot"><div class="progress"><div class="progress-label"><span>波次进度</span><b id="progressText">0 / 8</b></div><div class="progress-track"><i id="progressBar"></i></div></div><button class="wave-btn" id="waveBtn">开始第 1 波 <span>▶</span></button></div>
    </section>
    <aside class="tower-panel"><div class="panel-title"><div><span>守护者</span><h2>橡果守卫</h2></div><span class="tip">最高 Lv.10</span></div><div class="tower-list" id="towerList"></div><div class="selected-info" id="selectedInfo"><span class="info-icon">🌰</span><div><b>拖动橡果塔改变位置</b><small>宝箱等级决定获得的炮塔等级</small></div></div><div class="evo-box" id="evoBox"><b>进化树</b><small>Lv.5 与 Lv.10 各选择一次方向</small><div class="evo-actions"><button data-evo="thorns">🌵 荆棘</button><button data-evo="frost">❄️ 冰霜</button><button data-evo="gold">✨ 黄金</button></div></div></aside>
  </main>
  <div class="evo-modal" id="evoModal" aria-hidden="true"><div class="evo-dialog"><button class="modal-close" id="evoClose">×</button><span class="modal-kicker">EVOLUTION UNLOCKED</span><h2 id="evoTitle">选择进化路线</h2><p>你的守卫已达到关键等级。选择一条路线，外观与攻击方式都会永久改变。</p><div class="evo-choices"><button data-modal-evo="thorns"><strong>🌵 荆棘之心</strong><small>攻击范围扩大，伤害大幅提升，并释放穿刺藤蔓。</small></button><button data-modal-evo="frost"><strong>❄️ 霜叶守卫</strong><small>快速挥击，命中敌人后造成持续减速。</small></button><button data-modal-evo="gold"><strong>✨ 黄金果核</strong><small>重击造成最高伤害，命中时爆发金色冲击波。</small></button></div></div></div>
  <script src="game.js"></script>
</body>
</html>
